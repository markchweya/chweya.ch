<!-- Dumi favicon set — include verbatim in every canton's <head>.
     Paths assume the brand folder is served at /shared/brand/, and that
     favicon.ico is ALSO copied to the web root: browsers request /favicon.ico
     directly, before they have parsed any markup. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/shared/brand/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/shared/brand/favicon/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0B3B57">
