<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Dumi">
  <title>Dumi</title>
  <!-- The 16px cut. At that size the full mark collapses into a dark blob with
       two specks, so this variant lifts the body out of near-black, enlarges
       the core, tightens the blur and drops the rim — which otherwise costs a
       whole pixel of the 16 available. Same composition, louder. -->
  <defs>
    <radialGradient id="sBody" cx="50%" cy="12%" r="80%">
      <stop offset="0%"   stop-color="#3E92B4"/>
      <stop offset="52%"  stop-color="#14567C"/>
      <stop offset="100%" stop-color="#0A3653" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sIce" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A6F2EE" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#6FD6D2" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#6FD6D2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD285" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#E8A33D" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="42%"  stop-color="#EAFFFD" stop-opacity=".92"/>
      <stop offset="75%"  stop-color="#8CE8E4" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6FD6D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="sSoft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="sClip"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>

  <g clip-path="url(#sClip)">
    <circle cx="32" cy="32" r="32" fill="url(#sBody)"/>
    <g filter="url(#sSoft)">
      <circle cx="18" cy="20" r="15" fill="url(#sIce)"/>
      <circle cx="46" cy="17" r="8"  fill="url(#sSpark)"/>
    </g>
    <circle cx="32" cy="33" r="12" fill="url(#sCore)"/>
  </g>
</svg>
